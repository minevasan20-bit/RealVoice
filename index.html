<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="mint">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="A customizable single-file voice recorder with local library, markers, visualizers and backups.">
<title>Voice Recorder Studio</title>
<style>
/* =============================================================
VOICE RECORDER STUDIO — SINGLE-FILE, SELF-CONTAINED UI
All colors, spacing, shadows and responsive behavior are below.
No external fonts, assets, libraries or frameworks are loaded.
============================================================= */
:root {
  color-scheme: dark;
  --bg: #080d1b;
  --bg-soft: #10182b;
  --panel: rgba(17,26,47,.88);
  --panel-2: rgba(28,40,66,.82);
  --panel-3: rgba(7,13,27,.54);
  --border: rgba(158,177,219,.15);
  --border-strong: rgba(158,177,219,.27);
  --text: #f2f5ff;
  --muted: #9aaac8;
  --subtle: #6f7f9f;
  --accent: #45e4bb;
  --accent-rgb: 69,228,187;
  --accent-2: #14b99b;
  --accent-text: #052c25;
  --danger: #ff657a;
  --danger-rgb: 255,101,122;
  --warning: #ffca70;
  --info: #8fb5ff;
  --shadow: 0 24px 70px rgba(0,0,0,.24);
  --radius-xl: 26px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --ease: 180ms ease;
  --max-width: 1050px;
}
html[data-accent="violet"] {
  --accent:#c1a0ff;
  --accent-rgb:193,160,255;
  --accent-2:#9261f5;
  --accent-text:#211037;
}
html[data-accent="blue"] {
  --accent:#79c8ff;
  --accent-rgb:121,200,255;
  --accent-2:#4198ed;
  --accent-text:#092541;
}
html[data-accent="rose"] {
  --accent:#ff9bc0;
  --accent-rgb:255,155,192;
  --accent-2:#ed679d;
  --accent-text:#3d1025;
}
html[data-accent="amber"] {
  --accent:#ffd27a;
  --accent-rgb:255,210,122;
  --accent-2:#f2a83b;
  --accent-text:#342008;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg:#edf2fb;
  --bg-soft:#e4ebf8;
  --panel:rgba(255,255,255,.92);
  --panel-2:rgba(242,246,255,.96);
  --panel-3:rgba(226,234,249,.72);
  --border:rgba(45,65,105,.14);
  --border-strong:rgba(45,65,105,.24);
  --text:#18233b;
  --muted:#576783;
  --subtle:#7887a1;
  --shadow:0 24px 70px rgba(37,55,94,.12);
  --accent-text:#072c25;
}
*,*::before,*::after {
  box-sizing:border-box;
}
html {
  min-height:100%;
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
}
body {
  min-height:100vh;
  margin:0;
  padding:18px 14px max(24px,env(safe-area-inset-bottom));
  padding-top:max(18px,env(safe-area-inset-top));
  color:var(--text);
  background:radial-gradient(ellipse at 5% 0%,rgba(var(--accent-rgb),.12),transparent 39%),
  radial-gradient(ellipse at 100% 28%,rgba(85,109,224,.13),transparent 40%),
  linear-gradient(155deg,var(--bg-soft),var(--bg) 64%);
  background-attachment:fixed;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.45;
}
button,input,select,textarea {
  font:inherit;
}
button,a,input,select,textarea {
  -webkit-tap-highlight-color:transparent;
}
button {
  color:inherit;
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible {
  outline:3px solid var(--accent);
  outline-offset:3px;
}
button:disabled {
  cursor:not-allowed!important;
  opacity:.55;
}
a {
  color:inherit;
}
[hidden] {
  display:none!important;
}
.app-shell {
  width:100%;
  max-width:var(--max-width);
  margin:0 auto;
}
.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin:5px 2px 23px;
}
.brand {
  display:flex;
  min-width:0;
  align-items:center;
  gap:12px;
}
.brand-mark {
  display:grid;
  width:47px;
  height:47px;
  flex:0 0 47px;
  place-items:center;
  border:1px solid rgba(var(--accent-rgb),.3);
  border-radius:16px;
  background:linear-gradient(140deg,rgba(var(--accent-rgb),.2),rgba(86,109,224,.14));
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  font-size:25px;
}
.brand-name {
  margin:0;
  font-size:clamp(16px,4vw,20px);
  font-weight:850;
  letter-spacing:-.6px;
}
.brand-subtitle {
  margin:2px 0 0;
  color:var(--muted);
  font-size:11px;
}
.privacy-pill,.count-pill,.small-pill {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1px solid var(--border);
  border-radius:999px;
  padding:7px 10px;
  background:var(--panel-3);
  color:var(--muted);
  font-size:10px;
  font-weight:750;
  white-space:nowrap;
}
.privacy-pill {
  color:var(--accent);
  border-color:rgba(var(--accent-rgb),.18);
}
.hero {
  margin-bottom:20px;
}
.eyebrow {
  margin:0 0 7px;
  color:var(--accent);
  font-size:10px;
  font-weight:850;
  letter-spacing:2px;
  text-transform:uppercase;
}
.hero h1 {
  margin:0;
  font-size:clamp(26px,6.4vw,40px);
  line-height:1.08;
  letter-spacing:-1.4px;
}
.hero p:last-child {
  max-width:650px;
  margin:10px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}
.tabbar {
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin:0 0 17px;
  padding:5px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--panel-3);
  scrollbar-width:none;
}
.tabbar::-webkit-scrollbar {
  display:none;
}
.tab-button {
  display:inline-flex;
  min-height:42px;
  flex:1 0 auto;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:9px 13px;
  border:1px solid transparent;
  border-radius:11px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  transition:background var(--ease),color var(--ease),border-color var(--ease);
}
.tab-button[aria-selected="true"] {
  color:var(--text);
  border-color:var(--border);
  background:var(--panel-2);
  box-shadow:0 5px 16px rgba(0,0,0,.08);
}
.panel {
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:var(--radius-xl);
  background:var(--panel);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
}
.panel + .panel {
  margin-top:18px;
}
.panel-header {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}
.panel-title {
  margin:0;
  font-size:18px;
  font-weight:850;
  letter-spacing:-.5px;
}
.panel-description {
  margin:6px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}
.panel-body {
  padding:20px;
}
.recorder-grid {
  display:grid;
  grid-template-columns:minmax(0,1.3fr) minmax(250px,.7fr);
  gap:18px;
}
.recorder-main {
  min-width:0;
  padding:21px;
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  background:var(--panel-3);
  text-align:center;
}
.recorder-side {
  display:flex;
  min-width:0;
  flex-direction:column;
  gap:13px;
}
.status-row {
  display:flex;
  min-height:34px;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.status {
  display:inline-flex;
  min-height:34px;
  max-width:100%;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:7px 12px;
  border:1px solid rgba(var(--accent-rgb),.18);
  border-radius:999px;
  background:rgba(var(--accent-rgb),.075);
  color:var(--accent);
  font-size:11px;
  font-weight:800;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.status[data-state="recording"] {
  color:#ff9dab;
  background:rgba(var(--danger-rgb),.1);
  border-color:rgba(var(--danger-rgb),.23);
}
.status[data-state="error"] {
  color:#ffabb7;
  background:rgba(var(--danger-rgb),.1);
  border-color:rgba(var(--danger-rgb),.25);
  border-radius:12px;
}
.status[data-state="info"] {
  color:var(--info);
  background:rgba(143,181,255,.09);
  border-color:rgba(143,181,255,.23);
}
.status[data-state="paused"] {
  color:var(--warning);
  background:rgba(255,202,112,.09);
  border-color:rgba(255,202,112,.23);
}
.timer {
  margin-top:24px;
  font-size:clamp(50px,10vw,70px);
  line-height:1;
  font-weight:850;
  font-variant-numeric:tabular-nums;
  letter-spacing:2px;
}
.timer-meta {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin:10px 0 24px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}
.live-dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--subtle);
}
.live-dot.is-on {
  background:var(--danger);
  box-shadow:0 0 0 4px rgba(var(--danger-rgb),.11);
  animation:pulse-dot 1.5s infinite;
}
.live-dot.is-paused {
  background:var(--warning);
}
.visualizer-frame {
  height:120px;
  overflow:hidden;
  margin:0 auto 10px;
  border:1px solid var(--border);
  border-radius:16px;
  background:rgba(3,8,19,.22);
}
#visualizer {
  display:block;
  width:100%;
  height:100%;
}
.meter-row {
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 1px 18px;
  text-align:left;
}
.meter-label {
  flex-shrink:0;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}
.meter-track {
  height:6px;
  flex:1;
  overflow:hidden;
  border-radius:999px;
  background:var(--border);
}
.meter-fill {
  width:0;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--accent-2),var(--accent));
  transition:width 80ms linear;
}
.meter-value {
  width:36px;
  flex-shrink:0;
  color:var(--muted);
  text-align:right;
  font-size:10px;
  font-variant-numeric:tabular-nums;
}
.record-actions {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.record-button {
  display:inline-flex;
  width:145px;
  height:145px;
  flex:0 0 145px;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:7px solid rgba(255,255,255,.08);
  border-radius:50%;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  color:var(--accent-text);
  box-shadow:0 0 0 1px rgba(var(--accent-rgb),.2),0 13px 32px rgba(var(--accent-rgb),.18);
  cursor:pointer;
  transition:transform var(--ease),box-shadow var(--ease),background var(--ease);
}
.record-button:hover:not(:disabled) {
  transform:translateY(-2px);
  box-shadow:0 0 0 1px rgba(var(--accent-rgb),.27),0 17px 37px rgba(var(--accent-rgb),.24);
}
.record-button:active:not(:disabled) {
  transform:scale(.97);
}
.record-button.is-recording {
  background:linear-gradient(145deg,#ff8796,#f04461);
  color:#3e0812;
  box-shadow:0 0 0 1px rgba(var(--danger-rgb),.2),0 12px 32px rgba(var(--danger-rgb),.2);
  animation:record-glow 2s ease-in-out infinite;
}
.record-button .emoji {
  font-size:34px;
  line-height:1;
}
.record-button .button-label {
  font-size:12px;
  font-weight:900;
}
.round-control {
  display:inline-flex;
  min-height:43px;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:10px 13px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel-2);
  color:var(--text);
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  transition:background var(--ease),transform var(--ease),border-color var(--ease);
}
.round-control:hover:not(:disabled) {
  transform:translateY(-1px);
  border-color:var(--border-strong);
}
.round-control.primary-soft {
  border-color:rgba(var(--accent-rgb),.2);
  background:rgba(var(--accent-rgb),.08);
  color:var(--accent);
}
.round-control.danger-soft {
  border-color:rgba(var(--danger-rgb),.23);
  background:rgba(var(--danger-rgb),.08);
  color:#ff9dab;
}
.button-help {
  margin:14px 0 0;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}
.mini-card {
  padding:16px;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  background:var(--panel-3);
}
.mini-card-title {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 0 12px;
  font-size:12px;
  font-weight:850;
}
.mini-card-subtitle {
  margin:-6px 0 12px;
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
}
.metric-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:11px;
}
.metric-row:last-child {
  border-bottom:0;
}
.metric-label {
  color:var(--muted);
}
.metric-value {
  max-width:62%;
  color:var(--text);
  text-align:right;
  font-weight:800;
  overflow-wrap:anywhere;
}
.muted-text {
  color:var(--muted);
}
.markers-list {
  display:grid;
  gap:7px;
  max-height:205px;
  overflow-y:auto;
}
.marker-empty {
  padding:10px 0 4px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}
.marker-row {
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
  padding:9px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
}
.marker-time {
  flex-shrink:0;
  color:var(--accent);
  font-size:10px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}
.marker-name {
  min-width:0;
  flex:1;
  color:var(--text);
  font-size:10px;
  overflow-wrap:anywhere;
}
.marker-remove {
  width:27px;
  height:27px;
  flex-shrink:0;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
}
.marker-remove:hover {
  background:rgba(var(--danger-rgb),.1);
  color:var(--danger);
}
.notice-box {
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel-3);
  color:var(--muted);
  font-size:10px;
  line-height:1.7;
}
.notice-box strong {
  color:var(--text);
}
.stats-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:11px;
  margin-bottom:17px;
}
.stat-card {
  min-width:0;
  padding:15px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--panel-3);
}
.stat-icon {
  margin-bottom:9px;
  font-size:19px;
}
.stat-value {
  display:block;
  font-size:clamp(18px,4vw,24px);
  line-height:1.15;
  font-weight:900;
  letter-spacing:-.6px;
  overflow-wrap:anywhere;
}
.stat-label {
  display:block;
  margin-top:6px;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}
.toolbar {
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  gap:9px;
  align-items:center;
  margin-bottom:14px;
}
.search-wrap {
  position:relative;
  min-width:0;
}
.search-wrap .search-icon {
  position:absolute;
  top:50%;
  left:13px;
  transform:translateY(-50%);
  font-size:14px;
  pointer-events:none;
}
.field,.select,.text-area {
  display:block;
  width:100%;
  min-width:0;
  min-height:43px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--panel-3);
  color:var(--text);
  font-size:12px;
  outline:none;
  transition:border-color var(--ease),box-shadow var(--ease);
}
.search-wrap .field {
  padding-left:37px;
}
.field::placeholder,.text-area::placeholder {
  color:var(--subtle);
}
.field:focus,.select:focus,.text-area:focus {
  border-color:rgba(var(--accent-rgb),.47);
  box-shadow:0 0 0 3px rgba(var(--accent-rgb),.07);
}
.select {
  cursor:pointer;
}
.text-area {
  min-height:92px;
  resize:vertical;
  line-height:1.65;
}
.button {
  display:inline-flex;
  min-height:42px;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:10px 13px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--panel-2);
  color:var(--text);
  font-size:11px;
  font-weight:850;
  text-decoration:none;
  white-space:nowrap;
  cursor:pointer;
  transition:background var(--ease),transform var(--ease),border-color var(--ease);
}
.button:hover:not(:disabled) {
  transform:translateY(-1px);
  border-color:var(--border-strong);
}
.button.primary {
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:var(--accent-text);
  border-color:transparent;
}
.button.soft {
  color:var(--accent);
  border-color:rgba(var(--accent-rgb),.22);
  background:rgba(var(--accent-rgb),.08);
}
.button.danger {
  color:#ff9dab;
  border-color:rgba(var(--danger-rgb),.22);
  background:rgba(var(--danger-rgb),.08);
}
.button.small {
  min-height:34px;
  padding:7px 10px;
  font-size:10px;
}
.filter-row {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  margin-bottom:16px;
}
.filter-chip {
  display:inline-flex;
  min-height:34px;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:7px 10px;
  border:1px solid var(--border);
  border-radius:999px;
  background:transparent;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  cursor:pointer;
}
.filter-chip[aria-pressed="true"] {
  border-color:rgba(var(--accent-rgb),.25);
  color:var(--accent);
  background:rgba(var(--accent-rgb),.08);
}
.recording-list {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}
.recording-card {
  display:flex;
  min-width:0;
  flex-direction:column;
  padding:15px;
  border:1px solid var(--border);
  border-radius:17px;
  background:var(--panel-3);
  animation:enter-card 220ms ease both;
}
.recording-card-head {
  display:flex;
  align-items:flex-start;
  gap:10px;
}
.file-art {
  display:grid;
  width:41px;
  height:41px;
  flex:0 0 41px;
  place-items:center;
  border:1px solid rgba(var(--accent-rgb),.16);
  border-radius:13px;
  background:rgba(var(--accent-rgb),.08);
  font-size:19px;
}
.recording-heading {
  min-width:0;
  flex:1;
}
.recording-name {
  margin:0;
  font-size:12px;
  font-weight:850;
  line-height:1.55;
  overflow-wrap:anywhere;
}
.recording-meta {
  margin:4px 0 0;
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
}
.favorite-button {
  display:grid;
  width:32px;
  height:32px;
  flex:0 0 32px;
  place-items:center;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
